name: Scrape X accounts

on:
  schedule:
    # Каждый час в 7 минут после часа (сдвиг, чтобы не попадать в пиковую
    # минуту "00", когда у GitHub Actions больше всего очередей)
    - cron: "7 * * * *"
  workflow_dispatch: {} # позволяет запустить вручную кнопкой в интерфейсе GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # нужно, чтобы закоммитить обновлённый data/state.json обратно в репозиторий

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Сессия (куки логина) хранится в кэше между запусками, а не логинится
      # заново каждый раз — заново логиниться с сервера самый подозрительный
      # для X паттерн поведения.
      - name: Restore session cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: storageState.json
          key: x-session-${{ github.run_id }}
          restore-keys: |
            x-session-

      # Если кэша ещё не было вообще (самый первый запуск) — берём
      # начальную сессию из секрета, который ты один раз туда положишь
      # после локального логина (см. README.md, шаг "Первый запуск").
      - name: Seed session from secret if no cache found
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: echo "$X_STORAGE_STATE_B64" | base64 -d > storageState.json
        env:
          X_STORAGE_STATE_B64: ${{ secrets.X_STORAGE_STATE_B64 }}

      - name: Run scraper
        run: npm run scrape
        env:
          WORKER_INGEST_URL: ${{ secrets.WORKER_INGEST_URL }}
          WORKER_INGEST_SECRET: ${{ secrets.WORKER_INGEST_SECRET }}

      # Сохраняем (возможно обновлённую) сессию обратно в кэш
      - name: Save session cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: storageState.json
          key: x-session-${{ github.run_id }}

      # Коммитим обновлённый data/state.json (последние увиденные твиты),
      # чтобы при следующем запуске не читать те же твиты повторно
      - name: Commit updated state
        run: |
          git config user.name "x-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: update last-seen state [skip ci]"
          git push
